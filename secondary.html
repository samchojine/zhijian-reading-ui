<body class="board-page secondary-board-page">
  <div class="grain" aria-hidden="true"></div>

  <header class="board-nav">
    <a class="board-brand" href="index.html" aria-label="纸间首页">
      <span class="brand-mark" data-brand-mark></span>
      <span class="board-brand-word">纸间<small>ZHIJIAN</small></span>
    </a>
    <div class="board-nav-meta">
      <span>SECONDARY SURFACES</span>
      <i></i>
      <span>UI CONCEPT / 2026</span>
    </div>
    <div class="board-nav-actions">
      <a class="board-secondary-link" href="index.html">← 主设计稿</a>
      <a class="proto-link" href="prototype.html">
        打开可交互原型
        <span class="link-arrow" aria-hidden="true">↗</span>

  <main class="board">
    <section class="secondary-hero">
      <div>
        <div class="eyebrow hero-eyebrow"><span>03</span> SECONDARY SURFACES · 07 SCREENS</div>
        <h1>主页面之外，<br /><em>还有安静的细部。</em></h1>

          搜索、整理、设置、阅读偏好、本地备份与文件导入导出。

        <div class="secondary-stats">

    <div class="secondary-grid" id="secondary-stage"></div>

    <footer class="secondary-footer-note">
      <span>＋ 导入由系统文件选择器接管，纸间只负责把选中的书带回本机。</span>
      <a href="prototype.html">在原型里实际点一遍 <span>→</span></a>
    </footer>
  </main>

  <script src="assets/app.js"></script>
  <script>
    document.querySelectorAll("[data-brand-mark]").forEach((el) => {
      el.innerHTML = Zhijian.brandMark();
